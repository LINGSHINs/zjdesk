<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- 书本图标 -->
  <g transform="translate(128, 120)">
    <!-- 书的左侧 -->
    <path d="M0 40 L0 232 C0 240 8 248 16 248 L120 248 L120 40 C120 32 112 24 104 24 L16 24 C8 24 0 32 0 40 Z" fill="url(#bookGrad)" opacity="0.95"/>
    <!-- 书的右侧 -->
    <path d="M120 40 L120 248 L224 248 C232 248 240 240 240 232 L240 40 C240 32 232 24 224 24 L136 24 C128 24 120 32 120 40 Z" fill="url(#bookGrad)" opacity="0.9"/>
    <!-- 书脊 -->
    <rect x="116" y="24" width="8" height="224" fill="#c7d2fe" opacity="0.6"/>
    <!-- 文字线条 -->
    <line x1="24" y1="72" x2="96" y2="72" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="24" y1="96" x2="88" y2="96" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="24" y1="120" x2="100" y2="120" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="24" y1="144" x2="80" y2="144" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    <line x1="144" y1="72" x2="216" y2="72" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="144" y1="96" x2="208" y2="96" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="144" y1="120" x2="220" y2="120" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="144" y1="144" x2="200" y2="144" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- 书桌桌面 -->
  <ellipse cx="256" cy="400" rx="160" ry="20" fill="#ffffff" opacity="0.15"/>
  <path d="M120 400 L120 380 C120 360 150 350 256 350 C362 350 392 360 392 380 L392 400" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- 星星装饰 -->
  <g fill="#ffffff" opacity="0.9">
    <polygon points="96,100 100,112 112,112 102,120 106,132 96,124 86,132 90,120 80,112 92,112" transform="scale(0.6) translate(40, 80)"/>
    <polygon points="420,80 424,92 436,92 426,100 430,112 420,104 410,112 414,100 404,92 416,92" transform="scale(0.5) translate(80, 40)"/>
  </g>
</svg>
